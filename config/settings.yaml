llm:
  provider: auto            # auto | gemini | openai | none  （github-models 已于 2026-07 退役）
  gemini:
    model: gemini-2.0-flash
  openai:
    model: openai/gpt-4o-mini   # 作为 OpenAI 兼容端点的默认模型名（可用 OPENAI_MODEL 覆盖）
analysis:
  max_items_per_run: 30     # 预留：单次分析条目上限（当前信号层全量采集，正文全量展示）
  trending_days: 1          # 趋势仓库时间窗（天）
  trending_min_stars: 100   # 趋势仓库最小 star
  trending_limit: 20        # 趋势仓库最多采集条数
notifier:
  enabled: false            # 配置 WEBHOOK_URL secret 后改为 true
  type: feishu              # feishu | serverchan
